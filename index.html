<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sawaira - Best Friend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background glowing stars -->
    <div class="stars"></div>

    <div class="container">
        <!-- Glowing Pulsating Heart with name inside -->
        <div class="heart-container">
            <div class="heart"></div>
            <div class="heart-text">Sawaira</div>
        </div>

        <!-- Sweet Lovely Note -->
        <div class="message-box">
            <h1>Dear Sawaira,</h1>
            <p>Kuch log zindagi mein aakar usay khubsurat bana dete hain, aur aap unhi mein se ek hain. Aap jaisi sachi aur pyaari dost hona kisi blessing se kam nahi hai. Har mushkil waqt mein sath dene aur itna acha dost banne ke liye शुक्रिया!</p>
            <p class="signature">Forever Grateful for Your Friendship ✨</p>
        </div>
    </div>
</body>
</html>
